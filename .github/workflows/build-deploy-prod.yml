# Builds main and deploys it to prod - shared by deploy-prod.yml and base-image-refresh.yml
# Callers need `permissions: { contents: read, id-token: write }` and `secrets: inherit`.
name: Build and deploy to prod
on: workflow_call

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      image-suffix: release-${{ github.ref_name }}
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: prod-gcp
      resource: .nais/config.yml
      vars: .nais/vars-prod.yml
      var: image=${{ needs.build.outputs.image }}
